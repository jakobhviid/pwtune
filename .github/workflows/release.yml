name: release

# Build on every push to main, publish a versioned release, and auto-update the
# Homebrew formula in jakobhviid/homebrew-tap. Zero manual steps once TAP_TOKEN
# is set (a fine-grained PAT with Contents:write on the tap repo). Without it,
# the build+release still run and the tap update is skipped with a warning.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Stamp version (so `pwtune --version` matches the release)
        run: |
          # Version = Conventional-Commit semver from history (never bump by hand):
          #   feat: -> minor | fix:/other -> patch | type!: breaking -> major (baseline 1.0.0)
          v=$(git log --reverse --format='%H%x09%s' | awk -F'\t' 'BEGIN{maj=1;min=0;pat=0}{s=$2;if(s~/^[A-Za-z]+(\([^)]*\))?!:/){maj++;min=0;pat=0}else if(s~/^feat(\([^)]*\))?:/){min++;pat=0}else{pat++}}END{print maj"."min"."pat}')
          sed -i -E "s/^version = \"[^\"]*\"/version = \"$v\"/" Cargo.toml
          echo "stamped $v"
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build (static musl, via cross)
        run: cross build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist
          tar czf "dist/pwtune-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" pwtune
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: art
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Same Conventional-Commit semver as the stamp step (kept in sync).
          VERSION=$(git log --reverse --format='%H%x09%s' | awk -F'\t' 'BEGIN{maj=1;min=0;pat=0}{s=$2;if(s~/^[A-Za-z]+(\([^)]*\))?!:/){maj++;min=0;pat=0}else if(s~/^feat(\([^)]*\))?:/){min++;pat=0}else{pat++}}END{print maj"."min"."pat}')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Repackage the prebuilt x86_64 Linux binary as a Homebrew bottle so
          # `brew install` POURS it (no build-from-source, no C compiler gate).
          # A poured bottle skips the formula's `install`, so the keg must already
          # hold what install produces: binary + man page + completions.
          keg="pwtune/${VERSION}"
          bin="bottlestage/${keg}/bin"
          man="bottlestage/${keg}/share/man/man1"
          zc="bottlestage/${keg}/share/zsh/site-functions"
          bc="bottlestage/${keg}/share/bash-completion/completions"
          fc="bottlestage/${keg}/share/fish/vendor_completions.d"
          rm -rf bottlestage && mkdir -p "$bin" "$man" "$zc" "$bc" "$fc"
          tar xzf art/pwtune-x86_64-unknown-linux-musl.tar.gz -C "$bin"
          "$bin/pwtune" man > "$man/pwtune.1"
          "$bin/pwtune" completions zsh  > "$zc/_pwtune"
          "$bin/pwtune" completions bash > "$bc/pwtune"
          "$bin/pwtune" completions fish > "$fc/pwtune.fish"
          ( cd bottlestage && tar czf "../art/pwtune-${VERSION}.x86_64_linux.bottle.tar.gz" pwtune )
          echo "BOTTLE_SHA=$(sha256sum "art/pwtune-${VERSION}.x86_64_linux.bottle.tar.gz" | awk '{print $1}')" >> "$GITHUB_ENV"
          gh release create "v$VERSION" art/*.tar.gz \
            --title "v$VERSION" --notes "Automated build from ${GITHUB_SHA:0:7}" \
            || gh release upload "v$VERSION" art/*.tar.gz --clobber
      - name: Prune old releases (keep the latest 10)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in $(gh release list --json tagName,createdAt -q 'sort_by(.createdAt) | reverse | .[10:] | .[].tagName'); do
            gh release delete "$t" --cleanup-tag -y || true
          done
      - name: Update Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::warning::TAP_DEPLOY_KEY not set — built & released, but skipping the tap update."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes"
          x=$(sha256sum art/pwtune-x86_64-unknown-linux-musl.tar.gz | awk '{print $1}')
          a=$(sha256sum art/pwtune-aarch64-unknown-linux-musl.tar.gz | awk '{print $1}')
          sed -e "s/@VERSION@/${VERSION}/g" -e "s/@BOTTLE_SHA@/${BOTTLE_SHA}/g" \
            -e "s/@X86_SHA@/${x}/g" -e "s/@ARM_SHA@/${a}/g" \
            ci/pwtune.rb.tmpl > /tmp/pwtune.rb
          git clone git@github.com:jakobhviid/homebrew-tap tap
          mkdir -p tap/Formula
          cp /tmp/pwtune.rb tap/Formula/pwtune.rb
          cd tap
          git config user.name "tap-bot"
          git config user.email "tap-bot@users.noreply.github.com"
          git add Formula/pwtune.rb
          git commit -m "pwtune ${VERSION}" || { echo "no formula change"; exit 0; }
          git push
